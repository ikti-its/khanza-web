name: CodeIgniter 4 CI Check

on:
  workflow_dispatch:

jobs:
  quality:
    name: PHP 8.5 / Code Quality
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: intl, mbstring, gd, pdo_pgsql
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Vendor Directory
        id: vendor-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --optimize-autoloader

      - name: Run Mago Guard
        run: vendor/bin/mago --config .config/mago.toml guard

      # - name: Run Mago Static Analysis
      #   run: vendor/bin/mago --config .config/mago.toml analyze

      # - name: Run Mago Linter
      #   run: vendor/bin/mago --config .config/mago.toml lint

      # - name: Verify Formatting
      #   run: vendor/bin/mago --config .config/mago.toml fmt --check