name: CodeIgniter 4 CI Check

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan menjalankan CI (Opsional)'
        required: false
        default: 'Pengecekan rutin kode CI4'

jobs:
  quality:
    name: PHP 8.5 / Code Quality
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: intl, mbstring, gd, pdo_pgsql
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --optimize-autoloader

      - name: Verify Platform Requirements
        run: composer check-platform-reqs

      - name: Run Mago Guard
        run: vendor/bin/mago --config .config/mago.toml guard

      - name: Run Mago Static Analysis
        run: vendor/bin/mago --config .config/mago.toml analyze

      - name: Run Mago Linter
        run: vendor/bin/mago --config .config/mago.toml lint

      - name: Verify Formatting
        run: vendor/bin/mago --config .config/mago.toml fmt --check